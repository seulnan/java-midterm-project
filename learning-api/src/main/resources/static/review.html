<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QBit — 복습 노트</title>
<style>
  :root{ --bg:#f4f5f7; --card:#fff; --line:#e5e7eb; --fg:#111827; --muted:#6b7280; --accent:#4338ca; --bad:#b91c1c; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--fg);min-height:100vh;
    font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',Segoe UI,sans-serif;
    display:flex;justify-content:center;padding:32px 16px;}
  .wrap{width:100%;max-width:680px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .brand .logo{font-size:22px;font-weight:800;color:var(--accent);}
  .brand .sub{font-size:13px;color:var(--muted);}
  .summary{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 22px;margin-bottom:18px;display:flex;gap:28px;align-items:baseline;}
  .summary .big{font-size:26px;font-weight:800;color:var(--accent);}
  .summary .lbl{font-size:13px;color:var(--muted);margin-left:6px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:#4338ca;background:#eef2ff;
    padding:3px 10px;border-radius:999px;margin-bottom:10px;}
  .badge.fe{color:#047857;background:#ecfdf5;}
  .qtitle{font-size:17px;font-weight:700;line-height:1.4;margin-bottom:6px;}
  .qcontent{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px;}
  .label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px;}
  .myanswer{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    font-size:14px;line-height:1.6;color:#374151;white-space:pre-wrap;}
  .score{font-size:22px;font-weight:800;}
  .score.bad{color:var(--bad);} .score.ok{color:#047857;}
  .miss{border-left:3px solid #fca5a5;padding:8px 14px;margin:8px 0;}
  .miss .t{font-size:14px;font-weight:700;color:#111827;}
  .miss .w{font-size:13px;color:#4b5563;line-height:1.6;margin-top:3px;}
  .model{background:#f5f6ff;border-radius:10px;padding:12px 16px;font-size:13px;color:#374151;line-height:1.7;}
  .attempts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .att{font-size:13px;font-weight:700;padding:4px 12px;border-radius:8px;background:#f3f4f6;color:#374151;}
  .att:last-child{outline:2px solid var(--accent);}
  .next{font-size:12px;color:var(--muted);margin-top:14px;}
  .empty{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:40px;text-align:center;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="logo">QBit</span><span class="sub">복습 노트 · 내 답안과 피드백</span></div>
  <div id="summary" class="summary" style="display:none">
    <div><span id="total" class="big">0</span><span class="lbl">총 시도</span></div>
    <div><span id="correct" class="big">0</span><span class="lbl">정답</span></div>
    <div><span id="noteCount" class="big">0</span><span class="lbl">복습 대상</span></div>
  </div>
  <div id="list"></div>
</div>

<script>
  const email = new URLSearchParams(location.search).get('email');
  const $ = id => document.getElementById(id);
  const esc = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  fetch('/api/review/me?email=' + encodeURIComponent(email))
    .then(r => r.json())
    .then(res => {
      const d = res.data;
      $('summary').style.display = 'flex';
      $('total').textContent = d.totalAttempts;
      $('correct').textContent = d.correctCount;
      $('noteCount').textContent = d.items.length;

      if (!d.items.length) {
        $('list').innerHTML = '<div class="empty">복습할 오답이 없어요. 👍</div>';
        return;
      }
      $('list').innerHTML = d.items.map(renderItem).join('');
    })
    .catch(() => { $('list').innerHTML = '<div class="empty">불러오지 못했습니다.</div>'; });

  function renderItem(it) {
    const feClass = it.category !== 'BACKEND' ? ' fe' : '';
    const scoreClass = it.score >= 70 ? 'ok' : 'bad';
    const missed = (it.missed || []).map(m =>
      '<div class="miss"><div class="t">✗ ' + esc(m.label) + '</div><div class="w">' + esc(m.why) + '</div></div>').join('');
    const attempts = (it.attemptScores || []).map(s => '<span class="att">' + s + '점</span>').join('');
    const next = it.nextReviewAt ? new Date(it.nextReviewAt).toLocaleDateString('ko-KR') : '-';
    return ''
      + '<div class="card">'
      + '<span class="badge' + feClass + '">' + esc(it.category) + '</span>'
      + '<div class="qtitle">' + esc(it.title) + '</div>'
      + '<div class="qcontent">' + esc(it.content) + '</div>'
      + '<div class="label">내가 제출한 답안</div>'
      + '<div class="myanswer">' + (esc(it.myAnswer) || '<span style="color:#9ca3af">(빈 답안)</span>') + '</div>'
      + '<div class="label">채점</div><div><span class="score ' + scoreClass + '">' + it.score + '점</span></div>'
      + (missed ? '<div class="label">놓친 개념 (약점)</div>' + missed : '')
      + (it.modelAnswer ? '<div class="label">모범답안 요지</div><div class="model">' + esc(it.modelAnswer) + '</div>' : '')
      + '<div class="label">시도별 점수 (' + it.attemptCount + '회)</div><div class="attempts">' + (attempts || '-') + '</div>'
      + '<div class="next">다음 복습 예정: ' + next + ' (현재 간격 ' + it.intervalDays + '일)</div>'
      + '</div>';
  }
</script>
</body>
</html>
