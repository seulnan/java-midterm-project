spring:
  datasource:
    url: "${SUPABASE_DB_JDBC_URL}"
    username: "${SUPABASE_DB_USERNAME}"
    password: "${SUPABASE_DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: Hikari-learning
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    host: "${SMTP_HOST}"
    port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

learning:
  mail:
    sender: smtp
